name: private-phase-1-verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AAS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  AAS_PR_BASE: ${{ github.event.pull_request.base.sha || '' }}
  AAS_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}

jobs:
  reproducibility:
    name: ${{ matrix.os }} reproducibility
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: node scripts/ci-head-evidence.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        with:
          name: exact-head-evidence-${{ matrix.os }}
          path: exact-head-evidence.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:fast
      - run: pnpm check:generated
      - run: pnpm check:package

  conformance-skeleton:
    name: workspace conformance skeleton (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: node scripts/ci-head-evidence.mjs
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:conformance
