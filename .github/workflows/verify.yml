name: private-phase-1-verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reproducibility:
    name: ${{ matrix.os }} reproducibility
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:fast
      - run: pnpm check:generated
      - run: pnpm check:package

  conformance-skeleton:
    name: workspace conformance skeleton (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:conformance
